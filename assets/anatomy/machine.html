<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contexto Juicio Acción</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(960px,100% - 32px);margin:64px auto 96px}

.iso{--lit-blue:#29B5E8;--rej:#FF9F36}
.iso[data-theme="dark"]{--anatomy-lit:#29B5E8}
.iso[data-theme]{--anatomy-lit:#29B5E8;--anatomy-red:#FF9F36}
.iso .ticket.rej .iso-edge,.iso .rej-liner>.iso-edge,.iso .rej-wall>.iso-edge{stroke:var(--rej)}
.iso .ticket.rej .iso-fill,.iso .ticket.rej .iso-top,.iso .ticket.rej .iso-shade{fill:color-mix(in srgb,var(--rej) 36%,var(--anatomy-paper))}
.iso .rej-liner>.iso-top,.iso .rej-liner>.iso-fill{fill:color-mix(in srgb,var(--rej) 30%,var(--anatomy-paper))}
.iso .rej-wall>.iso-fill{fill:color-mix(in srgb,var(--rej) 18%,var(--anatomy-shade-3))}
.iso .rej-wall>.iso-top{fill:color-mix(in srgb,var(--rej) 26%,var(--anatomy-top))}
.iso .iso-line.rej-line{stroke:var(--rej)}
.iso .iso-line[data-tone="hi"].ink{stroke:var(--anatomy-hi)}
.iso .ticket .iso-fill,.iso .ticket .iso-top{fill:color-mix(in srgb,var(--lit-blue) 24%,#fff)}
.iso .ticket .iso-shade{fill:color-mix(in srgb,var(--lit-blue) 42%,var(--anatomy-shade-3))}
.iso .ticket:not(.rej) .iso-edge{stroke:color-mix(in srgb,var(--lit-blue) 70%,#000)}
.iso .ticket .iso-edge{stroke-width:1}
.iso[data-theme="light"]{--anatomy-weight:.9px;--anatomy-shade-0:#8d8d88;--anatomy-shade-1:#a4a49f;--anatomy-shade-2:#bbbbb6;--anatomy-shade-3:#d1d1cc;--anatomy-hi:#0a0a0c;--anatomy-mid:#2d2d33;--anatomy-lo:#66666c;--anatomy-faint:#a0a0a6;--anatomy-halo-opacity:.45;--anatomy-lit-shade:#e6eef2}
body.bare.iso[data-theme="light"]{--anatomy-weight:3px}
body.bare .iso-line[data-dotted]{stroke-width:3px;stroke-dasharray:.01 11px}
body.bare .iso-line[data-flow]{stroke-dasharray:8px 24px}
body.bare .iso-line[data-dashed]{stroke-dasharray:12px 12px}
body.bare .iso-halo{filter:blur(12px)!important}
body.bare .iso .ticket .iso-edge{stroke-width:3px}
body.bare [data-part="needle"]{stroke-width:3.2px!important}
.iso[data-theme="light"] .bench>.iso-top,.iso[data-theme="light"] .bench>.iso-fill{fill:#c4c4bf}
.iso[data-theme="light"] .bench>.iso-top{fill:#cfcfca}
.iso-stage{outline:none;touch-action:pan-y;cursor:crosshair}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.iso-wire[data-on] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-on]>.iso-line{stroke:var(--anatomy-hi)}
.iso-wire[data-on]>.iso-line[data-flow]{stroke-dasharray:2 5}
body.bare{background:#fff}
body.bare .iso-page{width:auto;margin:0}
body.bare .iso-figure{margin:0}
body.bare .iso-plate{padding:0;background:transparent;box-shadow:none;width:900px}
body.bare .iso-plate-corners,body.bare .iso-legend{display:none}
body.bare .iso-svg{width:900px;height:380px;display:block}
@media (max-width:560px){.iso-plate .iso-svg{transform:scale(1.12);transform-origin:50% 50%}.iso-plate{overflow:hidden}}

// The machine's model: a pure function of time. Every number the figure shows comes from here.
// One cycle = one request ticket riding the carriage through the three stations.
// Needs HOME, S1, S2, S3, PIN_REACH, PIN_DEPTH from geo.mjs.

const reachShare = () => PIN_REACH / (PIN_REACH + PIN_DEPTH);
const ramp = (t, a, b) => {
  const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
  return x * x * (3 - 2 * x);
};
const lerp = (a, b, x) => a + (b - a) * x;

// Event times in seconds from the start of a cycle. Pass and reject share everything until the press.
const TIMES = {
  fadeIn: [0, 0.7],
  toS1: [0.5, 2.2],
  drawerOut: [2.3, 3.2],
  padDown: [3.1, 3.6],
  ink: [3.4, 3.9],
  padUp: [3.9, 4.4],
  drawerIn: [4.3, 5.1],
  toS2: [5.2, 7.0],
  pinStart: 7.1,
  pinSpan: 0.6,
  pinStagger: 0.16,
  permit: [8.6, 9.0],
  pinsUp: [9.0, 9.6],
  toS3: [9.8, 11.6],
  keyA: [11.8, 12.4],
  keyB: [12.6, 13.2],
  shutterOpen: [13.3, 13.8],
  ramDown: [13.9, 14.3],
  stamp: [14.2, 14.5],
  ramUp: [14.7, 15.3],
  shutterShut: [15.4, 15.8],
  slipOut: [15.4, 16.2],
  keysBack: [16.2, 16.8],
  backPass: [16.6, 18.4],
  endPass: 19.0,
  // reject branch
  gate: [12.4, 13.4],
  gateBack: [13.9, 14.8],
  backReject: [15.0, 16.8],
  endReject: 17.4,
};

const verdictOf = (missing) => ({ count: 4 - missing.length, pass: missing.length === 0 });
const lengthOf = (missing) => (missing.length === 0 ? TIMES.endPass : TIMES.endReject);

function stateAt(t, missing, prior) {
  const T = TIMES;
  const v = verdictOf(missing);
  const r0 = reachShare();
  const s = { t, pass: v.pass, count: v.count, missing };

  s.ticketAlpha = ramp(t, ...T.fadeIn) * (v.pass ? 1 - ramp(t, T.endPass - 0.7, T.endPass) : 1);
  // carriage
  let cx = lerp(HOME, S1, ramp(t, ...T.toS1));
  cx = lerp(cx, S2, ramp(t, ...T.toS2));
  cx = lerp(cx, S3, ramp(t, ...T.toS3));
  const back = v.pass ? T.backPass : T.backReject;
  cx = lerp(cx, HOME, ramp(t, ...back));
  s.cx = cx;
  // station 1
  s.drawer = ramp(t, ...T.drawerOut) - ramp(t, ...T.drawerIn);
  s.pad = ramp(t, ...T.padDown) - ramp(t, ...T.padUp);
  s.ink = ramp(t, ...T.ink);
  // station 2
  s.pins = [0, 1, 2, 3].map((i) => {
    const a = T.pinStart + T.pinStagger * i;
    const goal = missing.includes(i) ? r0 : 1;
    return goal * ramp(t, a, a + T.pinSpan) * (1 - ramp(t, ...T.pinsUp));
  });
  // The dial holds its reading (a tally latch) after the pins lift.
  const seatedAt = (time) => {
    let sum = 0;
    for (let i = 0; i < 4; i++) {
      const a = T.pinStart + T.pinStagger * i;
      const goal = missing.includes(i) ? r0 : 1;
      const p = goal * ramp(time, a, a + T.pinSpan);
      sum += Math.min(1, Math.max(0, (p - r0) / (1 - r0)));
    }
    return sum;
  };
  s.dial = seatedAt(Math.min(t, T.pinsUp[0]));
  s.seated = Math.round(s.dial * 100) / 100;
  s.permit = v.pass ? ramp(t, ...T.permit) : 0;
  // station 3
  s.keyA = v.pass ? ramp(t, ...T.keyA) - ramp(t, ...T.keysBack) : 0;
  s.keyB = v.pass ? ramp(t, ...T.keyB) - ramp(t, ...T.keysBack) : 0;
  s.shutter = v.pass ? ramp(t, ...T.shutterOpen) - ramp(t, ...T.shutterShut) : 0;
  s.ram = v.pass ? ramp(t, ...T.ramDown) - ramp(t, ...T.ramUp) : 0;
  s.stamp = v.pass ? ramp(t, ...T.stamp) : 0;
  s.slip = v.pass ? ramp(t, ...T.slipOut) : 0;
  s.gate = v.pass ? 0 : ramp(t, ...T.gate) - ramp(t, ...T.gateBack);
  s.pushed = v.pass ? 0 : ramp(t, ...T.gate);
  s.rejected = !v.pass && t >= T.gate[0] + 0.15;
  // what the previous cycle left on the bench fades out while the next ticket arrives
  s.oldSlip = prior === "pass" ? 1 - ramp(t, 0.1, 1.1) : 0;
  s.oldBin = prior === "reject" ? 1 - ramp(t, 0.1, 1.1) : 0;
  s.text = textAt(t, missing, s);
  s.phase = phaseOf(t, v.pass);
  return s;
}

function phaseOf(t, pass) {
  const T = TIMES;
  if (t < T.toS1[1]) return "carga";
  if (t < T.toS2[0]) return "contexto";
  if (t < T.toS2[1]) return "traslado";
  if (t < T.toS3[0]) return "juicio";
  if (t < T.toS3[1]) return "traslado";
  return "acción";
}

function textAt(t, missing, s) {
  const T = TIMES;
  const v = verdictOf(missing);
  const n = (value) => `evidencia ${value}/4`;
  if (t < T.drawerOut[0]) return "solicitud · en el carril";
  if (t < T.toS2[0] + 0.9) return t < T.padDown[0] ? "contexto · cajón v3 abierto" : "contexto · definición v3 aprobada";
  // evidence counter: pins that have seated so far
  const seatedNow = s.pins.filter((p, i) => !missing.includes(i) && p > 0.985).length;
  const reached = seatedNow;
  if (t < T.permit[0]) return `${n(reached)} · comprobando`;
  if (t < T.toS3[0]) return v.pass ? `${n(4)} · pasa el calibre` : `${n(v.count)} · falta evidencia ${missing[0] + 1}`;
  if (t < T.toS3[1] + 0.2) return v.pass ? `${n(4)} · en camino a la prensa` : `${n(v.count)} · falta evidencia ${missing[0] + 1}`;
  if (v.pass) {
    if (t < T.keyA[0]) return `${n(4)} · espera validación`;
    if (t < T.keyB[0]) return `${n(4)} · validación de la aplicación`;
    if (t < T.ramDown[0]) return `${n(4)} · aprobación humana`;
    if (t < T.slipOut[0]) return `${n(4)} · aprobación humana · ejecutando`;
    return `${n(4)} · aprobación humana · efecto: 1 recibo`;
  }
  if (t < T.gate[0]) return `${n(v.count)} · validación fallida`;
  return `${n(v.count)} · rechazada · sin efecto`;
}

// Geometry builders for the machine. makeParts(k, P) returns static assemblies (built once, at build time)
// and dynamic builders (called again by the page each frame for the few parts whose shape changes).
// Needs the constants from geo.mjs and reachShare from model.mjs.

function makeParts(k, P) {
  const counter = { solids: 0 };
  const S = (paths, style = {}) => {
    counter.solids++;
    return k.solidSvg(paths, style);
  };
  const L = (d, style) => k.lineSvg(d, style);
  const D = (points, style) => k.dotsSvg(points, style);
  const at = (p) => k.iso(p, P);
  const dots3 = (list, style) => D(list.map((p) => at(p)), style);
  const plan = (x0, y0, x1, y1, r = 1) => ({ x: x0, y: y0, w: x1 - x0, d: y1 - y0, r });
  const slab = (x0, y0, x1, y1, z, h, o = {}) =>
    S(k.slabOf(plan(x0, y0, x1, y1, o.r ?? 1), z, h, P, o.steps ?? 3, o.bevel ?? 0.4), {
      tone: o.tone ?? "mid",
      crease: o.crease,
      lit: o.lit,
      inner: o.inner,
      className: o.cls,
    });
  const cyl = (x, y, r, z, h, o = {}) =>
    S(k.cylinder(x, y, r, z, h, P, o.steps ?? Math.max(12, Math.round(r * 4.2)), o.bevel ?? 0), {
      tone: o.tone ?? "mid",
      crease: o.crease,
      lit: o.lit,
      inner: o.inner,
      className: o.cls,
    });
  const byDepth = (list) => [...list].sort((a, b) => k.depthOf([a[0], a[1], 0], P) - k.depthOf([b[0], b[1], 0], P));
  const halo = (pl, z, h) => `<path class="iso-halo" d="${k.haloOf(pl, z, h, P)}" style="filter:blur(5px)"/>`;
  const rect = (pts) => k.pathOf(pts.map(at), true);
  const faceY = (y, x0, x1, z0, z1) => rect([[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]]);
  const faceX = (x, y0, y1, z0, z1) => rect([[x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1]]);
  const topRect = (x0, y0, x1, y1, z) => rect([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]]);
  const seg = (a, b) => k.segment(a, b, P);
  const dirOf = (phi) => {
    // world direction at screen angle phi (radians, clockwise from screen-up)
    const a = (P.azimuth * Math.PI) / 180;
    return [-Math.cos(a) * Math.cos(phi) + Math.sin(a) * Math.sin(phi), -Math.sin(a) * Math.cos(phi) - Math.cos(a) * Math.sin(phi)];
  };
  const topRing = (cx, cy, r, z, steps = 24) => k.ring(cx, cy, r, z, P, steps);

  // ───────────────────────── base, rails, feet, ruler ─────────────────────────
  // a polygon with rounded corners (radius per vertex), as a ring of points
  function roundPoly(pts, radii, steps = 6) {
    const out = [];
    pts.forEach((v, i) => {
      const p = pts[(i + pts.length - 1) % pts.length], n = pts[(i + 1) % pts.length], r = radii[i];
      const a = [p[0] - v[0], p[1] - v[1]], b = [n[0] - v[0], n[1] - v[1]];
      const la = Math.hypot(...a), lb = Math.hypot(...b);
      a[0] /= la; a[1] /= la; b[0] /= lb; b[1] /= lb;
      const c = [v[0] + (a[0] + b[0]) * r, v[1] + (a[1] + b[1]) * r];
      const t0 = Math.atan2(v[1] + a[1] * r - c[1], v[0] + a[0] * r - c[0]);
      const t1 = Math.atan2(v[1] + b[1] * r - c[1], v[0] + b[0] * r - c[0]);
      let d = t1 - t0;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      for (let s = 0; s <= steps; s++) out.push([c[0] + r * Math.cos(t0 + (d * s) / steps), c[1] + r * Math.sin(t0 + (d * s) / steps)]);
    });
    return out;
  }
  const BX0 = PLATE.x, BX1 = PLATE.x + PLATE.w, BY0 = PLATE.y, BY1 = PLATE.y + PLATE.d;
  const benchRing = (inset = 0) =>
    roundPoly(
      [[BX1 - inset, BY0 + inset], [BX1 - inset, BY1 - inset], [LOBE_X + inset, BY1 - inset], [LOBE_X + inset, FRONT - inset], [BX0 + inset, FRONT - inset], [BX0 + inset, BY0 + inset]],
      [Math.max(1, 10 - inset), Math.max(1, 10 - inset), Math.max(1, 10 - inset), 4, Math.max(1, 10 - inset), Math.max(1, 10 - inset)],
    );
  function base() {
    const ring0 = benchRing(0);
    const out = [`<path class="iso-halo" d="${k.extrude(ring0, -PLATE_H - FOOT_H, PLATE_H, P, { convex: false }).fill}"/>`];
    const feet = [];
    for (const x of [PLATE.x + 26, PLATE.x + PLATE.w / 2, PLATE.x + PLATE.w - 26]) for (const y of [-78, x > LOBE_X ? 68 : FRONT - 18]) feet.push([x, y]);
    for (const [x, y] of byDepth(feet)) {
      out.push(cyl(x, y, 7, -PLATE_H - FOOT_H, 1.6, { tone: "lo", steps: 24 }));
      out.push(cyl(x, y, 5.4, -PLATE_H - FOOT_H + 1.6, FOOT_H - 1.6, { tone: "mid", steps: 22 }));
    }
    counter.solids++;
    out.push(k.solidSvg(k.extrude(ring0, -PLATE_H, PLATE_H, P, { convex: false, bevel: 1.6 }), { tone: "mid", className: "bench", inner: L(k.ringSeam(ring0, -PLATE_H / 2, P), { tone: "faint" }) }));
    out.push(L(k.onTop(benchRing(5), 0, P, true), { tone: "faint" }));
    const screws = [[BX1 - 10, BY0 + 10], [BX1 - 10, BY1 - 10], [LOBE_X + 10, BY1 - 10], [BX0 + 10, FRONT - 10], [BX0 + 10, BY0 + 10]];
    out.push(L(screws.map(([x, y]) => k.ring(x, y, 2.2, 0, P, 14)).join(""), { tone: "lo" }));
    out.push(dots3(screws.map(([x, y]) => [x, y, 0]), { size: 0.5 }));
    // slots in the bench's front and end faces (closed outlines)
    for (const x of [PLATE.x + 60, PLATE.x + 90, -10, 20]) out.push(L(faceY(FRONT, x - 10, x + 10, -9, -5), { tone: "faint" }));
    for (const x of [S3 + 10, S3 + 70]) out.push(L(faceY(BY1, x - 10, x + 10, -9, -5), { tone: "faint" }));
    out.push(L(faceX(BX1, BY0 + 40, BY0 + 60, -9, -5), { tone: "faint" }), L(faceX(BX1, BY0 + 130, BY0 + 150, -9, -5), { tone: "faint" }));
    // front ruler strip with ticks, rooted on its back edge
    const strip = { x: PLATE.x + 24, y: FRONT - 16, w: 300, d: 7, r: 1 };
    out.push(S(k.slabOf(strip, 0, 0.6, P, 3), { tone: "lo", crease: "none" }));
    const ticks = k.topTicks(strip.x + 4, strip.x + strip.w - 4, 5, 5, strip.y + 0.8, 0.6, [2, 3.6], P);
    out.push(L(ticks.minor, { tone: "lo" }), L(ticks.major, { tone: "mid" }));
    out.push(dots3([[strip.x + 2, strip.y + 3.5, 0.6], [strip.x + strip.w - 2, strip.y + 3.5, 0.6]], { size: 0.45 }));
    // label plate with three rule lines (they stand for text, so they may stop)
    const lp = { x: PLATE.x + PLATE.w - 68, y: 72, w: 54, d: 14, r: 1.5 };
    out.push(S(k.slabOf(lp, 0, 0.8, P, 4), { tone: "lo", crease: "none" }));
    out.push(L(k.planOutline(k.insetPlan(lp, 1.6), 0.8, P), { tone: "faint" }));
    out.push(L(k.lineOnTop([lp.x + 6, lp.y + 4.2], [lp.x + 40, lp.y + 4.2], 0.8, P), { tone: "lo", free: true }));
    out.push(L(k.lineOnTop([lp.x + 6, lp.y + 7], [lp.x + 30, lp.y + 7], 0.8, P), { tone: "lo", free: true }));
    out.push(L(k.lineOnTop([lp.x + 6, lp.y + 9.8], [lp.x + 36, lp.y + 9.8], 0.8, P), { tone: "lo", free: true }));
    out.push(dots3([[lp.x + 47, lp.y + 4, 0.8], [lp.x + 47, lp.y + 10, 0.8]], { size: 0.45 }));
    return out.join("");
  }

  function rails() {
    const out = [];
    for (let x = RAIL_X[0] + 14; x < RAIL_X[1]; x += 76) {

  // ───────────────────────── feeder of tickets at the rail's start ─────────────────────────
  function feeder() {
    const out = [];

    for (let i = 0; i < 5; i++) out.push(slab(x0 + 7, -81 + i * 2.8, x1 - 7, -79.8 + i * 2.8, 16, 11 + (i % 2 ? 0 : 1), { tone: i === 4 ? "hi" : "mid", r: 0.3, steps: 2, bevel: 0 }));
    out.push(slab(x1 - 6.8, -82, x1 - 5, -66, 16, 9, { tone: "lo", r: 0.3, steps: 2, bevel: 0 }));
    out.push(L(faceY(-50, x0 + 8, x1 - 8, 5, 8.5), { tone: "hi" }));

    out.push(L(k.sideRing([x1, -69, 8], 3.2, "x", P, 14), { tone: "lo" }));

  }

  // ───────────────────────── station 1: card catalogue ─────────────────────────
  const COLS = [[CAB.x + 2, CAB.x + 32], [CAB.x + 34, CAB.x + 64]];
  const ROWS = [5, 18.5, 32];
  const ROW_H = 11;
  function cabinet() {
    const out = [];
    const body = plan(CAB.x, CAB.y, CAB.x + CAB.w, CAB.y + CAB.d, 2);
    out.push(halo(plan(CAB.x - 2, CAB.y - 2, CAB.x + CAB.w + 2, CAB.y + CAB.d + 2, 2.5), 0, 14));
    out.push(slab(CAB.x - 2, CAB.y - 2, CAB.x + CAB.w + 2, CAB.y + CAB.d + 2, 0, 3, { tone: "lo", r: 2.5, steps: 4, bevel: 0.6 }));
    out.push(S(k.slabOf(body, 3, CAB.h - 3, P, 4, 0.8), { tone: "mid", inner: L(k.sideSeam(body, 3 + (CAB.h - 3) / 2, P, 4), { tone: "faint" }) }));
    out.push(L(k.planOutline(k.insetPlan(body, 3), CAB.h, P, 4), { tone: "faint" }));
    out.push(dots3([[CAB.x + 5, CAB.y + 5, CAB.h], [CAB.x + CAB.w - 5, CAB.y + 5, CAB.h], [CAB.x + CAB.w - 5, CAB.y + CAB.d - 5, CAB.h], [CAB.x + 5, CAB.y + CAB.d - 5, CAB.h]], { size: 0.45 }));
    // right flank: a panel and three closed vent slots
    const xr = CAB.x + CAB.w;
    out.push(L(faceX(xr, CAB.y + 6, CAB.y + CAB.d - 6, 8, CAB.h - 5), { tone: "faint" }));
    for (const z of [14, 22, 30]) out.push(L(faceX(xr, CAB.y + 14, CAB.y + CAB.d - 14, z, z + 3), { tone: "lo" }));
    out.push(dots3([[xr, CAB.y + 9, 11], [xr, CAB.y + CAB.d - 9, 11], [xr, CAB.y + 9, CAB.h - 8], [xr, CAB.y + CAB.d - 9, CAB.h - 8]], { size: 0.45 }));
    // drawer fronts, all but the active one
    const fy = CAB.y + CAB.d;
    COLS.forEach(([x0, x1], c) => {
      ROWS.forEach((z, r) => {
        if (r === 1 && c === 0) return;
        out.push(slab(x0, fy - 1.2, x1, fy, z, ROW_H, { tone: "mid", r: 0.6, steps: 2, bevel: 0.3 }));
        const xc = (x0 + x1) / 2;
        out.push(slab(xc - 4, fy - 2.6, xc + 4, fy - 1.2, z + 2.2, 1.5, { tone: "lo", r: 0.5, steps: 2, bevel: 0 }));
        out.push(L(faceY(fy - 1.2, x0 + 4, x1 - 4, z + 5.2, z + 9), { tone: "faint" }));
        out.push(dots3([[x0 + 2.4, fy - 1.2, z + 2.6], [x1 - 2.4, fy - 1.2, z + 2.6]], { size: 0.4 }));
      });
    });
    return out.join("");
  }

  // The active drawer slides out along +y. Only the part in front of the cabinet face is drawn, so
  // nothing hides inside the body.
  function drawerSvg(d) {
    const fy = CAB.y + CAB.d;
    const out = [];
    const z0 = ROWS[1];
    const front = fy - 1.2 + DRAWER.travel * d;
    const x0 = DRAWER.x, x1 = DRAWER.x + DRAWER.w;
    if (d > 0.002) {
      const back = fy;
      const len = front - back;
      if (len > 0.5) {
        out.push(slab(x0 + 1.2, back, x1 - 1.2, front, z0 + 0.6, 1.2, { tone: "lo", r: 0.3, steps: 2, bevel: 0 }));
        out.push(slab(x0, back, x0 + 1.2, front, z0 + 0.6, ROW_H - 1.2, { tone: "mid", r: 0.3, steps: 2, bevel: 0.2 }));
        // cards stand across the drawer, back to front; the approved definition is the tall one
        const gap = 3.6;
        for (let j = 0, y = front - 4.4; y > back + 0.2; j++, y -= gap) {
          const key = j === 2;
          out.push(slab(x0 + 2, y - 1, x1 - 2, y, z0 + 1.8, key ? 9.6 : 7.2, { tone: key ? "hi" : "mid", r: 0.3, steps: 2, bevel: key ? 0.3 : 0, lit: false }));
        }

    out.push(slab(xc - 4, front + 1.2, xc + 4, front + 2.6, z0 + 2.2, 1.5, { tone: "lo", r: 0.5, steps: 2, bevel: 0 }));
    // version plate on the drawer front: the one engraved label
    out.push(slab(x0 + 4, front + 1.2, x1 - 4, front + 1.7, z0 + 5.2, 3.8, { tone: "lo", r: 0.4, steps: 2, bevel: 0, crease: "none" }));
    out.push(k.faceTextSvg(k.sideMatrix([xc, front + 1.7], z0 + 8.2, P, "left"), "v3", { size: 2.6, tone: "hi", anchor: "middle" }));
    out.push(dots3([[x0 + 2.4, front + 1.2, z0 + 2.6], [x1 - 2.4, front + 1.2, z0 + 2.6]], { size: 0.4 }));
    return out.join("");
  }

  function readingPad(d) {
    const z = PAD.up + (PAD.down - PAD.up) * d; // pad bottom
    const out = [];
    out.push(cyl(PAD.x, PAD.y, 1.8, z + PAD.h, 48 - z - PAD.h, { tone: "hi", steps: 14, crease: "none" }));
    out.push(cyl(PAD.x, PAD.y, PAD.r, z, PAD.h, { tone: "hi", steps: 24, bevel: 0.4 }));
    out.push(L(k.knurl(PAD.x, PAD.y, PAD.r, z, z + PAD.h, 20, P, 0.3), { tone: "lo" }));
    return out.join("");
  }

  function readingArm() {
    const out = [];
    const ax0 = ARM1.x, ax1 = ARM1.x + ARM1.w;
    out.push(slab(ax0 - 3, -94, ax1 + 3, -76, 44, 6, { tone: "mid", r: 1.5, steps: 3, bevel: 0.5 }));
    out.push(slab(ax0, ARM1.y0, ax1, ARM1.y1 - 4, ARM_Z[0], ARM_Z[1] - ARM_Z[0], { tone: "mid", r: 1.4, steps: 3, bevel: 0.5, inner: L(k.sideSeam(plan(ax0, ARM1.y0, ax1, ARM1.y1 - 4, 1.4), 53, P, 3), { tone: "faint" }) }));
    out.push(L(k.lineOnTop([PAD.x, ARM1.y0], [PAD.x, ARM1.y1 - 4], ARM_Z[1], P), { tone: "faint" }));
    out.push(dots3([[PAD.x - 4, -88, 56], [PAD.x + 4, -88, 56], [PAD.x - 4, -60, 56], [PAD.x + 4, -60, 56]], { size: 0.42 }));
    out.push(cyl(PAD.x, PAD.y, 6.6, 48, 8, { tone: "mid", steps: 28, bevel: 0.5 }));
    out.push(L(k.sideArc(PAD.x, PAD.y, 6.6, 52, P, 16), { tone: "faint" }));
    out.push(L(topRing(PAD.x, PAD.y, 4.2, 56, 20), { tone: "lo" }));
    return out.join("");
  }

  // ───────────────────────── station 2: go/no-go gauge ─────────────────────────
  const pinX = (i) => S2 + HOLE_DX[i];
  function gaugeColumn() {
    const out = [];
    const c = GAUGE_COL;
    const body = plan(c.x, c.y, c.x + c.w, c.y + c.d, 2);
    out.push(halo(body, 0, 12));
    out.push(S(k.slabOf(body, 0, c.h, P, 4, 0.8), { tone: "mid", inner: L(k.sideSeam(body, 8, P, 4), { tone: "faint" }) }));
    const fy = c.y + c.d;
    out.push(L(faceY(fy, c.x + 6, c.x + c.w - 6, 14, c.h - 8), { tone: "faint" }));
    for (const x of [c.x + 14, c.x + 22, c.x + 30]) out.push(L(faceY(fy, x, x + 4, c.h - 16, c.h - 12), { tone: "lo" }));
    out.push(dots3([[c.x + 4, fy, 5], [c.x + c.w - 4, fy, 5], [c.x + 4, fy, c.h - 5], [c.x + c.w - 4, fy, c.h - 5]], { size: 0.45 }));
    const xr = c.x + c.w;
    out.push(L(faceX(xr, c.y + 6, fy - 6, 8, c.h - 6), { tone: "faint" }));
    out.push(dots3([[xr, c.y + 10, 12], [xr, fy - 10, 12]], { size: 0.45 }));
    return out.join("");
  }
  function gaugeLower(pins) {
    // pins hang from the bridge; each is drawn from its tip (or the ticket's surface) up to the guide
    const out = [];
    for (let i = 0; i < 4; i++) {
      const p = pins[i];
      const tip = TICKET_TOP - PIN_DEPTH + (1 - p) * (PIN_REACH + PIN_DEPTH);
      const zb = Math.max(tip, TICKET_TOP);
      out.push(cyl(pinX(i), HOLE_Y, 1.5, zb, PIN_Z_ARM - zb, { tone: "hi", steps: 12, crease: "none" }));
      out.push(cyl(pinX(i), HOLE_Y, 1.5, zb, 1.0, { tone: "hi", steps: 12, bevel: 0 }));
    }
    return out.join("");
  }
  function gaugeArm() {
    const out = [];
    const a = GARM;
    const body = plan(a.x, a.y0, a.x + a.w, a.y1, 2);
    out.push(S(k.slabOf(body, a.z0, a.z1 - a.z0, P, 4, 0.7), { tone: "mid", inner: L(k.sideSeam(body, a.z0 + 5, P, 4), { tone: "faint" }) }));
    out.push(L(k.planOutline(k.insetPlan(body, 3), a.z1, P, 4), { tone: "faint" }));
    for (let i = 0; i < 4; i++) {
      out.push(cyl(pinX(i), HOLE_Y, 3.1, a.z0 - 3.4, 3.4, { tone: "lo", steps: 14 }));
      out.push(cyl(pinX(i), HOLE_Y, 3.5, a.z1, 2.4, { tone: "mid", steps: 14, bevel: 0.3 }));
    }
    out.push(dots3([[a.x + 4, -88, a.z1], [a.x + a.w - 4, -88, a.z1], [a.x + 4, -60, a.z1], [a.x + a.w - 4, -60, a.z1], [a.x + 4, 14, a.z1], [a.x + a.w - 4, 14, a.z1]], { size: 0.45 }));
    return out.join("");
  }
  const capTop = (p) => PIN_TOP + 2.4 + 1.2 + (1 - p) * (PIN_REACH + PIN_DEPTH);
  function gaugeUpper(pins) {
    const out = [];
    for (let i = 0; i < 4; i++) {
      const z = PIN_TOP + 2.4;
      const zc = capTop(pins[i]);
      out.push(cyl(pinX(i), HOLE_Y, 1.1, z, zc - z, { tone: "hi", steps: 10, crease: "none" }));
      out.push(cyl(pinX(i), HOLE_Y, 2.4, zc, 1.6, { tone: "hi", steps: 14, bevel: 0.3 }));
    }
    return out.join("");
  }
  const DIAL_SPAN = [-60, 60]; // degrees on screen, clockwise from straight up
  const dialAngle = (value) => ((DIAL_SPAN[0] + ((DIAL_SPAN[1] - DIAL_SPAN[0]) * value) / 4) * Math.PI) / 180;
  function dial() {
    const out = [];
    const { x, y, r, z, h } = DIAL;
    const top = z + h;
    out.push(cyl(x, y, r, z, h, { tone: "hi", steps: 56, bevel: 0.7, crease: "lo" }));
    out.push(L(k.knurl(x, y, r, top - 3.2, top, 72, P, 0.3), { tone: "lo" }));
    out.push(L(k.sideArc(x, y, r, top - 3.2, P, 36), { tone: "faint" }));
    out.push(L(topRing(x, y, r - 2.2, top, 56), { tone: "lo" }));
    // scale: 0..4, a tick every 0.2, a long one every whole number
    const minor = [], major = [];
    for (let i = 0; i <= 20; i++) {
      const phi = dialAngle(i / 5);
      const [dx, dy] = dirOf(phi);
      const r1 = r - 3, r0 = r1 - (i % 5 === 0 ? 3.2 : 1.6);
      (i % 5 === 0 ? major : minor).push(k.lineOnTop([x + dx * r0, y + dy * r0], [x + dx * r1, y + dy * r1], top, P));
    }
    out.push(L(minor.join(""), { tone: "lo" }), L(major.join(""), { tone: "mid" }));
    for (let n = 0; n <= 4; n++) {
      const [dx, dy] = dirOf(dialAngle(n));
      out.push(k.faceTextSvg(k.topMatrix([x + dx * (r - 9.4), y + dy * (r - 9.4) + 1], top, P, "x"), String(n), { size: 2.6, tone: "mid", anchor: "middle" }));
    }
    out.push(S(k.slabOf(plan(x + r - 1, y - 3, x + r + 4, y + 3, 1), z + 1.4, 4.6, P, 3, 0.3), { tone: "mid" }));
    out.push(L(topRing(x, y, 1.7, top, 14), { tone: "mid" }));
    return out.join("");
  }
  const needleD = (value) => {
    const { x, y, r, z, h } = DIAL;
    const [dx, dy] = dirOf(dialAngle(Math.max(0, Math.min(4, value))));
    return k.lineOnTop([x - dx * 3.4, y - dy * 3.4], [x + dx * (r - 4.4), y + dy * (r - 4.4)], z + h + 0.2, P);
  };

  // ───────────────────────── station 3: stamp press with two keys ─────────────────────────
  function pressColumn() {
    const out = [];
    const c = PCOL;
    const body = plan(c.x, c.y, c.x + c.w, c.y + c.d, 2);
    out.push(halo(body, 0, 12));
    out.push(S(k.slabOf(body, 0, c.h, P, 4, 0.8), { tone: "mid", inner: L(k.sideSeam(body, 8, P, 4), { tone: "faint" }) }));
    const fy = c.y + c.d;
    out.push(L(faceY(fy, c.x + 6, c.x + c.w - 6, 5, 14), { tone: "faint" }));
    out.push(L(faceY(fy, c.x + 6, c.x + c.w - 6, 33, c.h - 4), { tone: "faint" }));
    out.push(dots3([[c.x + 4, fy, 5], [c.x + c.w - 4, fy, 5], [c.x + 4, fy, c.h - 5], [c.x + c.w - 4, fy, c.h - 5]], { size: 0.45 }));
    const xr = c.x + c.w;
    // the slot where the receipt comes out
    out.push(L(faceX(xr, SLIP.y - 13, SLIP.y + 13, TRAY.z + TRAY.h - 0.2, TRAY.z + TRAY.h + 4), { tone: "hi" }));
    out.push(L(faceX(xr, c.y + 6, c.y + 14, 8, c.h - 6), { tone: "faint" }));
    out.push(dots3([[xr, c.y + c.d - 6, 8], [xr, c.y + c.d - 6, c.h - 8]], { size: 0.45 }));
    // key deck: bezel rings are drawn with the keys
    out.push(L(k.planOutline(k.insetPlan(body, 3), c.h, P, 4), { tone: "faint" }));
    return out.join("");
  }
  function relayBox() {
    const out = [];
    const b = BOX;
    out.push(slab(b.x, b.y0, b.x + b.w, b.y1, b.z0, b.z1 - b.z0, { tone: "mid", r: 1.2, steps: 3, bevel: 0.5 }));
    out.push(L(faceY(b.y1, b.x + 3, b.x + b.w - 3, b.z0 + 3, b.z1 - 3), { tone: "faint" }));
    const terms = [b.x + 4, b.x + 10, b.x + 30].map((x) => [x, b.y1, 26]);
    out.push(dots3(terms, { size: 1.1, tone: "hi" }));
    out.push(dots3([[b.x + 3, b.y1, b.z0 + 3], [b.x + b.w - 3, b.y1, b.z0 + 3]], { size: 0.45 }));
    return out.join("");
  }
  const keyPlace = (i) => KEYS[i];
  const hexRing = (x, y, r) => Array.from({ length: 6 }, (_, n) => [x + r * Math.cos((n * Math.PI) / 3 + Math.PI / 6), y + r * Math.sin((n * Math.PI) / 3 + Math.PI / 6)]);
  const KEY_BODY = [3.2, 4.2];
  function keyBase(i) {
    // two different keys: the application's is a round switch with a blade, the human one a hex-bezel barrel with a thumb lever
    const { x, y } = keyPlace(i);
    const zp = PCOL.h;
    const out = [];
    out.push(slab(x - 11, y - 11, x + 11, y + 11, zp, 3, { tone: "lo", r: 2.4, steps: 3, bevel: 0.4 }));
    if (i === 0) out.push(cyl(x, y, 8.4, zp + 3, 2, { tone: "mid", steps: 28, bevel: 0.3 }));
    else out.push(S(k.extrude(hexRing(x, y, 9.6), zp + 3, 2.4, P, { bevel: 0.3 }), { tone: "mid" }));
    const top = zp + (i === 0 ? 5 : 5.4);
    const t = [];
    for (const a of [-30, 60]) {
      const rad = (a * Math.PI) / 180;
      t.push(k.lineOnTop([x + Math.cos(rad) * 6.6, y + Math.sin(rad) * 6.6], [x + Math.cos(rad) * 8.2, y + Math.sin(rad) * 8.2], top, P));
    }
    out.push(L(t.join(""), { tone: "mid" }));
    out.push(cyl(x, y, i === 1 ? 5.8 : 4.4, top, KEY_BODY[i], { tone: i === 1 ? "hi" : "mid", steps: 24, bevel: 0.3 }));
    if (i === 1) out.push(L(k.knurl(x, y, 5.8, top, top + KEY_BODY[1], 22, P, 0.3), { tone: "lo" }));
    out.push(dots3([[x - 8, y + 8.5, zp + 3], [x + 8, y + 8.5, zp + 3]], { size: 0.42 }));
    return out.join("");
  }
  function keyBow(i, a) {
    const { x, y } = keyPlace(i);
    const ang = (-30 + 90 * a) * (Math.PI / 180);
    const len = i === 1 ? 10 : 7;
    const wid = i === 1 ? 2.2 : 1.5;
    const c = Math.cos(ang), s = Math.sin(ang);
    const rot = (u, v) => [x + u * c - v * s, y + u * s + v * c];
    const z = PCOL.h + (i === 0 ? 5 : 5.4) + KEY_BODY[i] + 0.2;
    const ring = [[-len, -wid], [len, -wid], [len, wid], [-len, wid]].map(([u, v]) => rot(u, v));
    const out = [S(k.extrude(ring, z, 2.4, P, { bevel: 0.3 }), { tone: "hi" })];
    out.push(L(k.lineOnTop([x - c * (len - 0.3), y - s * (len - 0.3)], [x + c * (len - 0.3), y + s * (len - 0.3)], z + 2.4, P), { tone: "lo" }));
    if (i === 1) {
      const [ex, ey] = rot(len, 0);
      out.push(cyl(ex, ey, 3.2, z, 3.4, { tone: "hi", steps: 16, bevel: 0.3 }));
    }
    out.push(dots3([[x, y, z + 2.4]], { size: 0.6, tone: "hi" }));
    return out.join("");
  }
  function pressArm() {
    const out = [];
    const a = PARM;
    const body = plan(a.x, a.y0, a.x + a.w, a.y1, 2);
    out.push(S(k.slabOf(body, a.z0, a.z1 - a.z0, P, 4, 0.7), { tone: "mid", inner: L(k.sideSeam(body, a.z0 + 5, P, 4), { tone: "faint" }) }));
    out.push(L(k.planOutline(k.insetPlan(body, 3), a.z1, P, 4), { tone: "faint" }));
    // ram sleeve under the arm and the actuator housing above it

    out.push(slab(S3 - 20, PCOL.y + PCOL.d, S3 - 12, yb + 0.6, 9.2, 3.2, { tone: "lo", r: 0.6, steps: 2, bevel: 0 }));

    out.push(slab(S3 - 26, PCOL.y + PCOL.d, S3 - 6, PCOL.y + PCOL.d + 3, 6, 11, { tone: "lo", r: 0.8, steps: 3, bevel: 0.3 }));

  function tray() {
    const out = [];
    const t = TRAY;
    out.push(slab(t.x + 2, t.y + 2, t.x + 8, t.y + t.d - 2, 0, t.z, { tone: "lo", r: 0.8, steps: 3, bevel: 0.3 }));

  // ───────────────────────── bin for rejected requests ─────────────────────────
  function binBack() {
    const out = [];

  function binFront() {

  // ───────────────────────── carriage and ticket ─────────────────────────
  function carriage() {
    const out = [];
    const hw = CAR_HW, hd = CAR_HD;
    out.push(`<path class="iso-halo" d="${k.haloOf(plan(-hw + 3, -hd + 3, hw - 3, hd - 3, 3), CAR_Z[0], 0.1, P)}" style="filter:blur(3px)"/>`);

  function ticket(cls = "") {

const PARTS = makeParts(kk, P);
// Live behaviour: an idle tour that cycles a passing ticket and a rejected one,
// pointer and keyboard to take away (or give back) a piece of evidence.
// Inlined after the kit, geo.mjs, model.mjs and parts.mjs; it is not an ES module on its own.

const stage = document.querySelector(".iso-stage");
const svgEl = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const live = document.querySelector(".sr");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const part = (name) => svgEl.querySelector('[data-part="' + name + '"]');
const E = {
  car: part("car"), ticket: part("ticket"), oldTicket: part("oldTicket"), drawer: part("drawer"), pad: part("pad"), pinsLow: part("pinsLow"),
  pinsUp: part("pinsUp"), needle: part("needle"), ramLow: part("ramLow"), ramTop: part("ramTop"), keyA: part("keyA"), keyB: part("keyB"),
  shutter: part("shutter"), paddle: part("paddle"), slip: part("slip"),
  wirePermit: part("wirePermit"), wireA: part("wireA"), wireB: part("wireB"),
  ink: part("ticket").querySelector('[data-part="ink"]'), stamp: part("ticket").querySelector('[data-part="stamp"]'),
};
const holes = [0, 1, 2, 3].map((i) => ({ hole: part("ticket").querySelector('[data-part="hole' + i + '"]'), blank: part("ticket").querySelector('[data-part="blank' + i + '"]') }));
const query = new URLSearchParams(location.search);
const frozenAt = query.has("t") ? Number(query.get("t")) : null;
if (query.has("bare") || location.hash === "#bare") document.body.classList.add("bare");
if (query.has("w")) {
  const w = Number(query.get("w"));
  svgEl.style.width = w + "px";
  svgEl.style.height = Math.round((w * H) / W) + "px";
  document.querySelector(".iso-plate").style.width = w + "px";
}

const TOUR_MISSING = [2];
const run = {
  t: 0,
  missing: query.has("miss") ? query.get("miss").split(",").filter(Boolean).map((n) => Number(n) - 1) : [],
  prior: null,
  index: 0,
  manual: query.has("miss"),
  shown: null,
  blendFrom: null,
  blendAt: 0,
  clock: 0,
  quietAt: 0,
};
let frame = 0, last = 0, visible = false, resumeTimer = 0, lastText = "", lastSpoken = "";

const mixNumber = (a, b, x) => a + (b - a) * x;
function blendStates(from, to, x) {
  const out = { ...to };
  for (const key of Object.keys(to)) {
    const a = from[key], b = to[key];
    if (typeof b === "number" && typeof a === "number") out[key] = mixNumber(a, b, x);
    else if (Array.isArray(b) && Array.isArray(a) && typeof b[0] === "number" && a.length === b.length) out[key] = b.map((v, i) => mixNumber(a[i], v, x));
  }
  return out;
}

function restart(missing, keepPrior) {
  run.missing = missing;
  if (!keepPrior) run.prior = null;
  run.t = 0;
  run.blendFrom = run.shown;
  run.blendAt = run.clock;
}

function wire(el, on) {
  const w = el.firstElementChild;
  if (!w) return;
  if (on) {
    w.setAttribute("data-on", "");
    w.firstElementChild.setAttribute("data-flow", "");
  } else {
    w.removeAttribute("data-on");
    w.firstElementChild.removeAttribute("data-flow");
  }
}

const cache = {};
function setHTML(name, html) {
  if (cache[name] === html) return;
  cache[name] = html;
  E[name].innerHTML = html;
}
function setAttr(el, name, value) {
  const key = el.dataset.part + "|" + name;
  if (cache[key] === value) return;
  cache[key] = value;
  el.setAttribute(name, value);
}

function draw(s) {
  const pushed = Math.max(0, PADDLE.y0 + PADDLE.d + PUSH * s.pushed + TICKET.hd);
  const drop = -3.8 * ramp(pushed, 22, 44) - 2.7 * ramp(pushed, 49, 54);
  const tx = s.pushed > 0.001 ? S3 : s.cx;
  setAttr(E.car, "transform", translateAlong(P, [s.cx, 0, 0]));
  setAttr(E.ticket, "transform", translateAlong(P, [tx, pushed, drop]));
  setAttr(E.ticket, "opacity", s.ticketAlpha.toFixed(3));
  const cls = "ticket" + (s.rejected ? " rej" : "");
  const tk = E.ticket.firstElementChild;
  if (tk.getAttribute("class") !== cls) tk.setAttribute("class", cls);
  setAttr(E.oldTicket, "opacity", s.oldBin.toFixed(3));
  setAttr(E.ink, "opacity", s.ink.toFixed(3));
  setAttr(E.stamp, "opacity", s.stamp.toFixed(3));
  holes.forEach((h, i) => {
    const gone = run.missing.includes(i);
    h.hole.style.display = gone ? "none" : "";
    h.blank.style.display = gone ? "" : "none";
  });
  setHTML("drawer", PARTS.drawerSvg(s.drawer));
  setHTML("pad", PARTS.readingPad(s.pad));
  setHTML("pinsLow", PARTS.gaugeLower(s.pins));
  setHTML("pinsUp", PARTS.gaugeUpper(s.pins));
  setAttr(E.needle, "d", PARTS.needleD(s.dial));
  setHTML("ramLow", PARTS.ramLower(s.ram));
  setHTML("ramTop", PARTS.ramTop(s.ram));
  setHTML("keyA", PARTS.keyBow(0, s.keyA));
  setHTML("keyB", PARTS.keyBow(1, s.keyB));
  setHTML("shutter", PARTS.shutter(s.shutter));
  setHTML("paddle", PARTS.paddle(s.gate));
  const slipOut = s.slip > 0.001;
  setAttr(E.slip, "transform", translateAlong(P, [SLIP.stroke * (slipOut ? s.slip : 1), 0, 0]));
  setAttr(E.slip, "opacity", (slipOut ? 1 : s.oldSlip).toFixed(3));
  wire(E.wirePermit, s.permit > 0.5);
  wire(E.wireA, s.keyA > 0.5);
  wire(E.wireB, s.keyB > 0.5);
  if (s.text !== lastText) {
    lastText = s.text;
    readout.textContent = s.text;
  }
}

function describe(s) {
  return s.text;
}

function step(dt) {
  const calm = still.matches;
  if (frozenAt !== null) {
    run.t = frozenAt;
  } else if (calm) {
    run.t = run.missing.length ? TIMES.gate[1] : TIMES.ramDown[1] - 0.05;
  } else {
    run.t += dt;
    run.clock += dt;
    const length = lengthOf(run.missing);
    if (run.t >= length) {
      run.prior = run.missing.length ? "reject" : "pass";
      run.index++;
      if (!run.manual) run.missing = run.index % 2 === 1 ? TOUR_MISSING : [];
      run.t = 0;
    }
  }
  let s = stateAt(run.t, run.missing, run.prior);
  if (run.blendFrom && !calm) {
    const x = Math.min(1, (run.clock - run.blendAt) / 0.7);
    if (x < 1) s = blendStates(run.blendFrom, s, x * x * (3 - 2 * x));
    else run.blendFrom = null;
  }
  run.shown = s;
  draw(s);
  if (s.text !== lastSpoken && (s.phase !== run.lastPhase)) {
    run.lastPhase = s.phase;
  }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  step(dt);
  frame = visible && frozenAt === null && !still.matches ? requestAnimationFrame(tick) : 0;
}
const go = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

// Taking a piece of evidence away from the ticket (or giving it back) restarts the cycle with that setting.
function toggle(index) {
  const next = run.missing.includes(index) ? run.missing.filter((n) => n !== index) : [...run.missing, index].sort();
  run.manual = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    run.manual = false;
  }, 12000);
  restart(next, false);
  const word = next.length ? "falta la evidencia " + (next[0] + 1) : "evidencia completa";
  live.textContent = "Siguiente solicitud: " + word;
  if (frozenAt !== null || still.matches) step(0);
  go();
}
function reset() {
  run.manual = false;
  clearTimeout(resumeTimer);
  restart([], false);
  live.textContent = "Siguiente solicitud: evidencia completa";
  if (frozenAt !== null || still.matches) step(0);
  go();
}

stage.addEventListener("keydown", (event) => {
  if (event.key >= "1" && event.key <= "4") {
    event.preventDefault();
    toggle(Number(event.key) - 1);
  } else if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    toggle(2);
  } else if (event.key === "Escape") {
    event.preventDefault();
    reset();
  }
});
stage.addEventListener("pointerdown", (event) => {
  const box = svgEl.getBoundingClientRect();
  const x = ((event.clientX - box.left) / box.width) * W;
  const y = ((event.clientY - box.top) / box.height) * H;
  let best = -1, bestD = 22;
  for (let i = 0; i < 4; i++) {
    const [px, py] = iso([S2 + HOLE_DX[i], HOLE_Y, 40], P);
    const d = Math.hypot(px - x, py - y);
    if (d < bestD) { best = i; bestD = d; }
  }
  if (best >= 0) toggle(best);
});
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) go();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.setAttribute("aria-description", "Pulsa 1 a 4 para quitar la evidencia de un pin");
step(0);
if (frozenAt === null && !still.matches) {
  // start inside the first cycle so the page never opens on an empty bench
  visible = true;
  go();
}

</script></body></html>
